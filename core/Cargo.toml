[package]
name = "aiassist-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "aiassist_core"
crate-type = ["cdylib", "rlib", "staticlib"]

[dependencies]
aho-corasick = "1"
regex = "1"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uniffi = "0.28"

[dev-dependencies]
serde_json = "1"
