// Build lõi Rust cho các ABI Android rồi chép .so vào jniLibs.
// Chạy trong Docker (cargo-ndk có sẵn): gradle assembleDebug là đủ.
def rustAbis = [
    "arm64-v8a"    : "aarch64-linux-android",
    "armeabi-v7a"  : "armv7-linux-androideabi",
    "x86_64"       : "x86_64-linux-android",
]
tasks.register("buildRust", Exec) {
    def out = layout.projectDirectory.dir("src/main/jniLibs").asFile.absolutePath
    def cmds = rustAbis.collect { abi, triple ->
        "cargo ndk -t $abi -o $out build -p aiassist-core --lib"
    }.join(" && ")
    commandLine("bash", "-c", cmds)
    workingDir = rootDir.parentFile
}
tasks.named("preBuild") { dependsOn("buildRust") }
